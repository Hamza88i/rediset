# RediSet default configuration.
# Every property can be overridden by an environment variable using the
# REDISET_ prefix and the property name upper-cased with dots replaced by
# underscores. For example, server.port -> REDISET_SERVER_PORT.

# --- Server ---
server.host=0.0.0.0
server.port=6412
server.max-clients=10000
server.idle-timeout-seconds=0

# --- Protocol limits (backpressure) ---
protocol.max-request-size=536870912
protocol.max-bulk-string-size=536870912
protocol.max-array-size=1048576

# --- Storage ---
storage.max-memory-bytes=0
storage.eviction-policy=noeviction

# --- Expiration ---
expiration.sweep-interval-millis=100
expiration.sweep-sample-size=20

# --- Persistence ---
persistence.dir=./rediset-data
persistence.snapshot.enabled=true
persistence.snapshot.file=dump.rdb
persistence.aof.enabled=false
persistence.aof.file=appendonly.aof
persistence.aof.fsync=everysec

# --- Replication ---
replication.role=primary
replication.primary-host=
replication.primary-port=0
